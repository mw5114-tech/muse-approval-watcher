name: Muse approval watcher (5m)

on:
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'observe never clicks; apply uses all-card mode when enabled in config'
        required: true
        default: observe
        type: choice
        options:
          - observe
          - apply


permissions:
  contents: read

concurrency:
  group: muse-approval-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: muse-chromium-${{ runner.os }}-pw-1.64.1
      - name: Install browser tools
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run approval safety tests
        if: github.event_name == 'push'
        run: python -m unittest discover -s tests -p 'test_approve_all.py' -v
      - name: Check pending Muse approvals
        env:
          MUSE_AUTH_B64: ${{ secrets.MUSE_AUTH_B64 }}
          MUSE_AUTH_B64_01: ${{ secrets.MUSE_AUTH_B64_01 }}
          MUSE_AUTH_B64_02: ${{ secrets.MUSE_AUTH_B64_02 }}
          MUSE_AUTH_B64_03: ${{ secrets.MUSE_AUTH_B64_03 }}
          MUSE_AUTH_B64_04: ${{ secrets.MUSE_AUTH_B64_04 }}
          MUSE_AUTH_B64_05: ${{ secrets.MUSE_AUTH_B64_05 }}
          MUSE_AUTH_B64_06: ${{ secrets.MUSE_AUTH_B64_06 }}
          MUSE_AUTH_B64_07: ${{ secrets.MUSE_AUTH_B64_07 }}
          MUSE_AUTH_B64_08: ${{ secrets.MUSE_AUTH_B64_08 }}
          MUSE_AUTH_B64_09: ${{ secrets.MUSE_AUTH_B64_09 }}
          MUSE_AUTH_B64_10: ${{ secrets.MUSE_AUTH_B64_10 }}
          MUSE_AUTH_B64_11: ${{ secrets.MUSE_AUTH_B64_11 }}
          MUSE_AUTH_B64_12: ${{ secrets.MUSE_AUTH_B64_12 }}
          WATCH_MODE: ${{ github.event_name == 'schedule' && 'apply' || github.event_name == 'workflow_dispatch' && inputs.mode || 'observe' }}
        run: python scripts/approve_all.py --mode "$WATCH_MODE" --config approval_policy.json
