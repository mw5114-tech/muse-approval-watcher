name: Muse login smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify Muse login session (no approvals or changes)
        env:
          MUSE_AUTH_B64: ${{ secrets.MUSE_AUTH_B64 }}
        run: python scripts/check_muse_session.py
