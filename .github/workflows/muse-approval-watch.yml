name: Muse approval watcher (10m)
run-name: Muse watcher / ${{ github.event_name == 'push' && 'apply' || inputs.mode }}

on:
  # Scheduling is handled by the external server; no GitHub cron.
  # Only a write to this exact request file on main requests a run.
  push:
    branches: [main]
    paths:
      - '.github/requests/muse-run.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'observe never clicks; apply uses all-card mode when enabled in config'
        required: true
        default: observe
        type: choice
        options:
          - observe
          - apply


permissions:
  contents: read

concurrency:
  group: muse-approval-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: muse-chromium-${{ runner.os }}-${{ runner.arch }}-shell-${{ hashFiles('requirements.txt') }}
      - name: Install browser tools
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --only-shell chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'; then
            python -m playwright install --with-deps --only-shell chromium
            python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
          fi
      - name: Check pending Muse approvals
        env:
          PYTHONUNBUFFERED: '1'
          # Disabled by setting the repository variable to "false".
          # Defaults to guarded, one-click remembered-account recovery.
          MUSE_ONE_CLICK_LOGIN_ENABLED: ${{ vars.MUSE_ONE_CLICK_LOGIN_ENABLED }}
          # Optional safety pin: only choose an account whose displayed email
          # matches this Secret. Never log or commit the email.
          MUSE_EXPECTED_LOGIN_EMAIL: ${{ secrets.MUSE_EXPECTED_LOGIN_EMAIL }}
          # Only needed for an account chooser on a non-Muse official auth host.
          MUSE_LOGIN_ALLOWED_HOSTS: ${{ vars.MUSE_LOGIN_ALLOWED_HOSTS }}
          MUSE_AUTH_B64: ${{ secrets.MUSE_AUTH_B64 }}
          MUSE_AUTH_B64_01: ${{ secrets.MUSE_AUTH_B64_01 }}
          MUSE_AUTH_B64_02: ${{ secrets.MUSE_AUTH_B64_02 }}
          MUSE_AUTH_B64_03: ${{ secrets.MUSE_AUTH_B64_03 }}
          MUSE_AUTH_B64_04: ${{ secrets.MUSE_AUTH_B64_04 }}
          MUSE_AUTH_B64_05: ${{ secrets.MUSE_AUTH_B64_05 }}
          MUSE_AUTH_B64_06: ${{ secrets.MUSE_AUTH_B64_06 }}
          MUSE_AUTH_B64_07: ${{ secrets.MUSE_AUTH_B64_07 }}
          MUSE_AUTH_B64_08: ${{ secrets.MUSE_AUTH_B64_08 }}
          MUSE_AUTH_B64_09: ${{ secrets.MUSE_AUTH_B64_09 }}
          MUSE_AUTH_B64_10: ${{ secrets.MUSE_AUTH_B64_10 }}
          MUSE_AUTH_B64_11: ${{ secrets.MUSE_AUTH_B64_11 }}
          MUSE_AUTH_B64_12: ${{ secrets.MUSE_AUTH_B64_12 }}
          WATCH_MODE: ${{ github.event_name == 'push' && 'apply' || github.event_name == 'workflow_dispatch' && inputs.mode || 'observe' }}
        run: python scripts/approve_all.py --mode "$WATCH_MODE" --config approval_policy.json
