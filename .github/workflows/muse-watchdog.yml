name: Muse schedule health watchdog

on:
  schedule:
    - cron: '11/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check_health.py'
      - '.github/workflows/muse-watchdog.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: muse-health-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check and recover missing scheduled Muse runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/check_health.py --recovery-age 22 --warning-age 30 --critical-age 90
