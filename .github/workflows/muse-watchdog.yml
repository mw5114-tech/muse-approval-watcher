name: Muse schedule health watchdog

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check recent scheduled Muse watcher runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_health.py --max-age-minutes 30
