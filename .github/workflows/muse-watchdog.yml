name: Muse schedule health watchdog

on:
  schedule:
    # Stagger health checks independently of the watcher's 06/16/... slots.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check_health.py'
      - '.github/workflows/muse-watchdog.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: muse-health-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check and recover missing scheduled Muse runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/check_health.py --recovery-age 12 --warning-age 25 --critical-age 60 --no-recovery
          else
            python3 scripts/check_health.py --recovery-age 12 --warning-age 25 --critical-age 60
          fi
